services:
  postgres:
    container_name: kc-postgres-17
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: keycloak_db
    ports:
      - "5433:5432"
      - "5432:5432"
    volumes:
      - "C:\\Users\\20And\\kc-data:/var/lib/postgresql/data"

  keycloak:
    container_name: keycloak-debug
    image: galeofan/keycloak:${version.keycloak}_phone-${project.version}

    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin

    ports:
      - "8080:8080"
      - "5005:5005" #debug

    depends_on:
      - postgres

    command:
      - start-dev
      - --spi-phone-default-service=mrc
      - --spi-phone-default-phone_auth-phone-default-region=RU
      - --spi-phone-default-source-hour-maximum=0
      - --spi-phone-default-target-hour-maximum=0
      - --spi-connections-http-client-default-disable-trust-manager=true